      <rect x="58" y="34" width="62" height="6" rx="3" fill="#ffffff" fill-opacity="0.12"/>
      <rect x="58" y="46" width="44" height="6" rx="3" fill="#ffffff" fill-opacity="0.12"/>
    </g>
    <g transform="translate(22,222)">
      <rect width="186" height="66" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#3D8BFF" stroke-opacity="0.4"/>
      <rect x="16" y="20" width="34" height="26" rx="5" fill="none" stroke="#3D8BFF" stroke-width="2"/>
      <path d="M16 24l17 12 17-12" fill="none" stroke="#3D8BFF" stroke-width="2" stroke-linejoin="round"/>
