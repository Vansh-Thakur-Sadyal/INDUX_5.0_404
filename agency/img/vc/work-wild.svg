<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="A camera frame with detections beside an audio waveform and an alert feed">
  <defs>
    <linearGradient id="g3Ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1030"/><stop offset="1" stop-color="#050818"/>
    </linearGradient>
    <radialGradient id="g3Glow" cx="0.2" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#FF6A2B" stop-opacity="0.34"/><stop offset="1" stop-color="#FF6A2B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3Glow2" cx="0.9" cy="0.85" r="0.65">
      <stop offset="0" stop-color="#16C79A" stop-opacity="0.30"/><stop offset="1" stop-color="#16C79A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g3Wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3D8BFF"/><stop offset="0.6" stop-color="#16C79A"/><stop offset="1" stop-color="#FF2E86"/>
    </linearGradient>
    <pattern id="g3Grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="760" height="400" fill="url(#g3Ground)"/>
