<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="A dashboard interface with navigation, metric tiles and a chart">
  <defs>
    <linearGradient id="wGround" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1030"/><stop offset="1" stop-color="#050818"/>
    </linearGradient>
    <radialGradient id="wGlow" cx="0.2" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#3D8BFF" stop-opacity="0.42"/><stop offset="1" stop-color="#3D8BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wGlow2" cx="0.9" cy="1" r="0.7">
      <stop offset="0" stop-color="#16C79A" stop-opacity="0.30"/><stop offset="1" stop-color="#16C79A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wBar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3D8BFF" stop-opacity="0.35"/><stop offset="1" stop-color="#3D8BFF"/>
    </linearGradient>
    <pattern id="wGrid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="760" height="400" fill="url(#wGround)"/>
  <rect width="760" height="400" fill="url(#wGrid)"/>
  <rect width="760" height="400" fill="url(#wGlow)"/>
  <rect width="760" height="400" fill="url(#wGlow2)"/>

  <!-- browser window -->
  <g>
    <rect x="86" y="52" width="588" height="296" rx="14" fill="#0C1234" stroke="#ffffff" stroke-opacity="0.13"/>
    <path d="M86 66a14 14 0 0 1 14-14h560a14 14 0 0 1 14 14v20H86z" fill="#ffffff" fill-opacity="0.05"/>
    <circle cx="110" cy="69" r="4.5" fill="#FF6A2B"/>
    <circle cx="127" cy="69" r="4.5" fill="#FFC24B"/>
    <circle cx="144" cy="69" r="4.5" fill="#16C79A"/>
    <rect x="168" y="62" width="200" height="14" rx="7" fill="#ffffff" fill-opacity="0.09"/>
    <line x1="86" y1="86" x2="674" y2="86" stroke="#ffffff" stroke-opacity="0.10"/>

    <!-- sidebar -->
    <line x1="192" y1="86" x2="192" y2="348" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect x="106" y="106" width="70" height="10" rx="5" fill="#3D8BFF" fill-opacity="0.85"/>
    <rect x="106" y="132" width="58" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.20"/>
    <rect x="106" y="156" width="66" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.20"/>
    <rect x="106" y="180" width="48" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.20"/>
    <rect x="106" y="204" width="62" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.20"/>
    <rect x="106" y="300" width="54" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.12"/>

    <!-- KPI tiles -->
    <g>
      <rect x="212" y="104" width="140" height="62" rx="9" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.09"/>
      <rect x="226" y="118" width="44" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.22"/>
      <rect x="226" y="134" width="70" height="14" rx="4" fill="#3D8BFF" fill-opacity="0.75"/>
      <rect x="366" y="104" width="140" height="62" rx="9" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.09"/>
      <rect x="380" y="118" width="52" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.22"/>
      <rect x="380" y="134" width="58" height="14" rx="4" fill="#16C79A" fill-opacity="0.8"/>
      <rect x="520" y="104" width="140" height="62" rx="9" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.09"/>
      <rect x="534" y="118" width="38" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.22"/>
      <rect x="534" y="134" width="76" height="14" rx="4" fill="#FF2E86" fill-opacity="0.7"/>
    </g>

    <!-- chart -->
    <g>
      <rect x="212" y="184" width="448" height="140" rx="10" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.08"/>
      <line x1="232" y1="300" x2="640" y2="300" stroke="#ffffff" stroke-opacity="0.12"/>
      <g>
        <rect x="248" y="252" width="26" height="48" rx="4" fill="url(#wBar)"/>
        <rect x="298" y="228" width="26" height="72" rx="4" fill="url(#wBar)"/>
        <rect x="348" y="264" width="26" height="36" rx="4" fill="url(#wBar)"/>
        <rect x="398" y="206" width="26" height="94" rx="4" fill="url(#wBar)"/>
        <rect x="448" y="238" width="26" height="62" rx="4" fill="url(#wBar)"/>
        <rect x="498" y="216" width="26" height="84" rx="4" fill="#16C79A" fill-opacity="0.85"/>
        <rect x="548" y="244" width="26" height="56" rx="4" fill="url(#wBar)"/>
        <rect x="598" y="200" width="26" height="100" rx="4" fill="url(#wBar)"/>
      </g>
      <polyline points="261,244 311,220 361,256 411,198 461,230 511,208 561,236 611,192"
                fill="none" stroke="#FF6A2B" stroke-opacity="0.85" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
