    <g>
      <rect x="20" y="44" width="128" height="38" rx="12" fill="#ffffff" fill-opacity="0.07"/>
      <rect x="34" y="56" width="86" height="6" rx="3" fill="#ffffff" fill-opacity="0.30"/>
      <rect x="34" y="68" width="62" height="6" rx="3" fill="#ffffff" fill-opacity="0.16"/>
    </g>
    <g>
      <rect x="64" y="94" width="128" height="52" rx="12" fill="#16C79A" fill-opacity="0.16" stroke="#16C79A" stroke-opacity="0.5"/>
      <rect x="78" y="106" width="94" height="6" rx="3" fill="#16C79A" fill-opacity="0.9"/>
      <rect x="78" y="120" width="70" height="6" rx="3" fill="#ffffff" fill-opacity="0.26"/>
      <rect x="78" y="132" width="86" height="6" rx="3" fill="#ffffff" fill-opacity="0.18"/>
    </g>
