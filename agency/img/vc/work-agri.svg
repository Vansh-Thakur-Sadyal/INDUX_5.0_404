        <rect x="64" y="17" width="3" height="8" rx="1.5"/><rect x="72" y="8" width="3" height="26" rx="1.5"/>
        <rect x="80" y="14" width="3" height="14" rx="1.5"/><rect x="88" y="11" width="3" height="20" rx="1.5"/>
        <rect x="96" y="17" width="3" height="8" rx="1.5"/><rect x="104" y="13" width="3" height="16" rx="1.5"/>
        <rect x="112" y="16" width="3" height="10" rx="1.5"/><rect x="120" y="12" width="3" height="18" rx="1.5"/>
