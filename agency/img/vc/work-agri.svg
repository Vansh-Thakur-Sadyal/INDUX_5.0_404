<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="A farmer assistant answering questions over chat and voice, grounded in a knowledge base">
  <defs>
    <linearGradient id="g1Ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1030"/><stop offset="1" stop-color="#050818"/>
    </linearGradient>
    <radialGradient id="g1Glow" cx="0.25" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#16C79A" stop-opacity="0.38"/><stop offset="1" stop-color="#16C79A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g1Glow2" cx="0.9" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#3D8BFF" stop-opacity="0.30"/><stop offset="1" stop-color="#3D8BFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="g1Grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="760" height="400" fill="url(#g1Ground)"/>
  <rect width="760" height="400" fill="url(#g1Grid)"/>
  <rect width="760" height="400" fill="url(#g1Glow)"/>
  <rect width="760" height="400" fill="url(#g1Glow2)"/>

