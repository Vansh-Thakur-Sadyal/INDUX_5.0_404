    <rect x="22" y="124" width="60" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.16"/>
    <rect x="22" y="142" width="72" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.16"/>
    <rect x="22" y="160" width="48" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.16"/>
