      <circle cx="30" cy="26" r="11" fill="#FF6A2B" fill-opacity="0.2"/>
      <path d="M25 21a3 3 0 0 1 3-3h2l2 5-2 2a10 10 0 0 0 5 5l2-2 5 2v2a3 3 0 0 1-3 3 15 15 0 0 1-14-14z" fill="none" stroke="#FF6A2B" stroke-width="1.6" stroke-linejoin="round"/>
