    <g transform="translate(41,24)">
      <path d="M22 34c0-14 10-24 24-24 0 14-10 24-24 24z" fill="#16C79A" fill-opacity="0.55"/>
      <path d="M22 34c0-14-10-24-24-24 0 14 10 24 24 24z" fill="#16C79A" fill-opacity="0.28"/>
