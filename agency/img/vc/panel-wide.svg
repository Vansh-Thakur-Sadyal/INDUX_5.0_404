<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-label="A product in flight: an application window, a live metric card and a deploy terminal">
  <defs>
    <linearGradient id="pGround" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1234"/><stop offset="1" stop-color="#04061A"/>
    </linearGradient>
    <radialGradient id="pGlowA" cx="0.12" cy="0.08" r="0.75">
      <stop offset="0" stop-color="#3D8BFF" stop-opacity="0.40"/><stop offset="1" stop-color="#3D8BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pGlowB" cx="0.95" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#FF2E86" stop-opacity="0.30"/><stop offset="1" stop-color="#FF2E86" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pGlowC" cx="0.6" cy="1" r="0.6">
      <stop offset="0" stop-color="#16C79A" stop-opacity="0.26"/><stop offset="1" stop-color="#16C79A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D8BFF" stop-opacity="0.55"/><stop offset="1" stop-color="#3D8BFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3D8BFF"/><stop offset="0.34" stop-color="#16C79A"/>
      <stop offset="0.7" stop-color="#FF2E86"/><stop offset="1" stop-color="#FF6A2B"/>
    </linearGradient>
    <pattern id="pGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="640" rx="20" fill="url(#pGround)"/>
  <rect width="1000" height="640" rx="20" fill="url(#pGrid)"/>
  <rect width="1000" height="640" rx="20" fill="url(#pGlowA)"/>
  <rect width="1000" height="640" rx="20" fill="url(#pGlowB)"/>
  <rect width="1000" height="640" rx="20" fill="url(#pGlowC)"/>

  <!-- main application window -->
  <g>
    <rect x="70" y="70" width="700" height="404" rx="16" fill="#0C1234" stroke="#ffffff" stroke-opacity="0.14"/>
    <path d="M70 86a16 16 0 0 1 16-16h668a16 16 0 0 1 16 16v26H70z" fill="#ffffff" fill-opacity="0.05"/>
    <circle cx="96" cy="91" r="5" fill="#FF6A2B"/>
    <circle cx="115" cy="91" r="5" fill="#FFC24B"/>
    <circle cx="134" cy="91" r="5" fill="#16C79A"/>
    <rect x="164" y="83" width="240" height="16" rx="8" fill="#ffffff" fill-opacity="0.09"/>
    <line x1="70" y1="112" x2="770" y2="112" stroke="#ffffff" stroke-opacity="0.10"/>

    <!-- sidebar -->
    <line x1="204" y1="112" x2="204" y2="474" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect x="94" y="140" width="82" height="11" rx="5.5" fill="#3D8BFF"/>
    <rect x="94" y="172" width="66" height="10" rx="5" fill="#ffffff" fill-opacity="0.20"/>
    <rect x="94" y="200" width="78" height="10" rx="5" fill="#ffffff" fill-opacity="0.20"/>
    <rect x="94" y="228" width="54" height="10" rx="5" fill="#ffffff" fill-opacity="0.20"/>
    <rect x="94" y="256" width="70" height="10" rx="5" fill="#ffffff" fill-opacity="0.20"/>
    <rect x="94" y="284" width="60" height="10" rx="5" fill="#ffffff" fill-opacity="0.20"/>
    <rect x="94" y="424" width="66" height="10" rx="5" fill="#ffffff" fill-opacity="0.11"/>

    <!-- headline row -->
    <rect x="232" y="140" width="180" height="14" rx="7" fill="#ffffff" fill-opacity="0.28"/>
    <rect x="232" y="164" width="120" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.14"/>
    <rect x="640" y="140" width="94" height="26" rx="13" fill="#3D8BFF" fill-opacity="0.2" stroke="#3D8BFF" stroke-opacity="0.6"/>

    <!-- area chart -->
    <g>
      <rect x="232" y="196" width="502" height="176" rx="12" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.08"/>
      <g stroke="#ffffff" stroke-opacity="0.07">
        <line x1="252" y1="238" x2="714" y2="238"/>
        <line x1="252" y1="286" x2="714" y2="286"/>
        <line x1="252" y1="334" x2="714" y2="334"/>
      </g>
      <path d="M252 330 L318 296 L384 312 L450 258 L516 278 L582 232 L648 250 L714 214 L714 352 L252 352 Z" fill="url(#pArea)"/>
      <polyline points="252,330 318,296 384,312 450,258 516,278 582,232 648,250 714,214"
                fill="none" stroke="#3D8BFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="252,344 318,330 384,336 450,308 516,320 582,296 648,306 714,282"
                fill="none" stroke="#16C79A" stroke-opacity="0.75" stroke-width="2.4"
                stroke-dasharray="7 7" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="714" cy="214" r="5.5" fill="#FF2E86"/>
    </g>

    <!-- table rows -->
    <g>
      <rect x="232" y="392" width="502" height="1" fill="#ffffff" fill-opacity="0.10"/>
      <rect x="232" y="406" width="112" height="8" rx="4" fill="#ffffff" fill-opacity="0.20"/>
      <rect x="392" y="406" width="72" height="8" rx="4" fill="#ffffff" fill-opacity="0.13"/>
      <rect x="512" y="406" width="96" height="8" rx="4" fill="#ffffff" fill-opacity="0.13"/>
      <rect x="674" y="402" width="60" height="16" rx="8" fill="#16C79A" fill-opacity="0.18"/>
      <rect x="232" y="434" width="140" height="8" rx="4" fill="#ffffff" fill-opacity="0.20"/>
      <rect x="392" y="434" width="58" height="8" rx="4" fill="#ffffff" fill-opacity="0.13"/>
      <rect x="512" y="434" width="80" height="8" rx="4" fill="#ffffff" fill-opacity="0.13"/>
      <rect x="674" y="430" width="60" height="16" rx="8" fill="#FF6A2B" fill-opacity="0.18"/>
    </g>
  </g>

  <!-- floating metric card -->
  <g transform="translate(686,236)">
    <rect width="248" height="140" rx="16" fill="#0E1540" stroke="#ffffff" stroke-opacity="0.18"/>
    <rect x="24" y="26" width="82" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.30"/>
    <rect x="24" y="50" width="126" height="22" rx="6" fill="#ffffff" fill-opacity="0.85"/>
    <rect x="24" y="88" width="200" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="24" y="88" width="142" height="5" rx="2.5" fill="url(#pRule)"/>
    <g>
      <rect x="24" y="106" width="70" height="20" rx="10" fill="#16C79A" fill-opacity="0.16"/>
      <path d="M36 118 l14 -14 M50 104 h-9 M50 104 v9" fill="none" stroke="#16C79A" stroke-width="2.2" stroke-linecap="round"/>
      <rect x="60" y="112" width="26" height="8" rx="4" fill="#16C79A" fill-opacity="0.7"/>
    </g>
  </g>

  <!-- deploy terminal -->
  <g transform="translate(180,432)">
    <rect width="480" height="150" rx="14" fill="#070B22" stroke="#ffffff" stroke-opacity="0.16"/>
    <rect x="0" y="0" width="480" height="34" rx="14" fill="#ffffff" fill-opacity="0.05"/>
    <rect x="0" y="20" width="480" height="14" fill="#ffffff" fill-opacity="0.05"/>
    <circle cx="22" cy="17" r="4.5" fill="#FF6A2B"/>
    <circle cx="39" cy="17" r="4.5" fill="#FFC24B"/>
    <circle cx="56" cy="17" r="4.5" fill="#16C79A"/>
    <rect x="80" y="12" width="88" height="10" rx="5" fill="#ffffff" fill-opacity="0.14"/>
    <g font-family="Consolas, Menlo, monospace" font-size="14">
      <text x="24" y="64" fill="#16C79A">$</text>
      <text x="42" y="64" fill="#C4CCE0">docker compose up -d</text>
      <text x="24" y="90" fill="#7C87A3">✔ traefik   healthy</text>
      <text x="24" y="114" fill="#7C87A3">✔ api       healthy</text>
      <text x="24" y="138" fill="#3D8BFF">→ live at your domain</text>
    </g>
    <rect x="236" y="128" width="9" height="16" fill="#3D8BFF" fill-opacity="0.85"/>
  </g>
</svg>
