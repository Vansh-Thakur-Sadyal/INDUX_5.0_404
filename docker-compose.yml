# Saarthi 2.0 on the Hostinger VPS, behind the shared Traefik.
#
#   https://indux5.0.visioncoders.in  ->  traefik  ->  127.0.0.1:8092  ->  this container
#
# Port 8092 because 8010 (the local dev port) is taken by soilq-precision on this box.
services:
  saarthi2:
    build: .
    image: saarthi2:local
    container_name: indux-saarthi
    restart: unless-stopped
    environment:
      # Telephony hands this URL to n8n/Twilio for the TTS audio, so it must be
      # the public name, not localhost.
      SAARTHI_PUBLIC_URL: ${SAARTHI_PUBLIC_URL:-https://indux5.0.visioncoders.in}
      SAARTHI_HOST: 0.0.0.0
      SAARTHI_PORT: "8010"
    volumes:
      # Single-FILE bind mount: Docker binds the INODE. Edit this file in place
      # (cat > file), never mv a new file over it, or the container keeps reading
      # the old one while the host shows the new one.
      - ./config/api_keys.env:/app/config/api_keys.env:ro
      # sqlite, the vector index and cached TTS audio survive rebuilds.
      - saarthi2-storage:/app/data/storage
    ports:
      - 127.0.0.1:8092:8010
    networks: [edge]

volumes:
  saarthi2-storage:

networks:
  edge:
    external: true
